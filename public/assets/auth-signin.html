<!doctype html>
<html lang="en" data-layout="vertical" data-sidebar="dark" data-sidebar-image="img-1" data-sidebar-size="lg" data-preloader="disable" data-theme="default" dir="rtl" data-topbar="light" data-bs-theme="light" data-theme-color="0">

<head>

    <meta charset="utf-8">
    <title>عنوان | داسیکس - قالب مدیریت و داشبورد</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="قالب مینیمال مدیریت و داشبورد" name="description">
    <meta content="Themesbrand" name="author">
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">
    
    <!-- Fonts css load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    
    <!-- Layout config Js -->
    <script src="assets/js/layout.js"></script>
    <!-- Bootstrap Css -->
    <link href="assets/css/bootstrap-rtl.min.css" rel="stylesheet" type="text/css">
    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css">
    <!-- App Css-->
    <link href="assets/css/app-rtl.min.css" rel="stylesheet" type="text/css">
    <!-- custom Css-->
    <link href="assets/css/custom-rtl.min.css" rel="stylesheet" type="text/css">
</head>

<body>


    <section class="auth-page-wrapper p-2 p-lg-4 position-relative d-flex align-items-center justify-content-center min-vh-100">
        <div class="card mb-0 w-100 p-3 p-lg-2" style="background-image: url('assets/images/auth/auth.jpg');background-size: cover;background-position: center;">
            <div class="effect-one"></div>
            <div class="row g-0 align-items-center">
                <div class="col-xxl-8 order-last order-xl-first">
                    <div class="card auth-card border-0 shadow-none mb-0 bg-transparent">
                        <div class="card-body p-4 p-xl-5 d-flex justify-content-between flex-column h-100">
                            
                            <div class="text-center mt-auto">
                                <p class="mb-0 mt-3 text-white">
                                    &copy;
                                    <script>document.write(new Date().getFullYear())</script> داسیکس. با عشق طراحی شده <i class="mdi mdi-heart text-danger"></i> توسط تیم Themesbrand
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <!--end col-->
                <div class="col-lg-8 col-xxl-4 mx-auto order-first order-xl-last">
                    <div class="card shadow-lg border-none m-lg-5">
                        <div class="card-body">
                            <div class="text-center mt-4">
                                <div class="mb-4 pb-2">
                                    <a href="index.html" class="auth-logo">
                                        <img src="assets/images/logo-dark.png" alt="" height="30" class="auth-logo-dark mx-auto">
                                        <img src="assets/images/logo-light.png" alt="" height="30" class="auth-logo-light mx-auto">
                                    </a>
                                </div>
                                <h5 class="fs-3xl">خوش آمدید</h5>
                                <p class="text-muted">برای ادامه به داسیکس وارد شوید.</p>
                            </div>
                            <div class="p-2 mt-4">
                                <form action="index.html">
        
                                    <div class="mb-3">
                                        <label for="username" class="form-label">نام کاربری <span class="text-danger">*</span></label>
                                        <div class="position-relative ">
                                            <input type="text" class="form-control  password-input" id="username" placeholder="نام کاربری را وارد کنید" required="">
                                        </div>
                                    </div>
        
                                    <div class="mb-3">
                                        <div class="float-end">
                                            <a href="auth-pass-reset.html" class="text-muted">رمز عبور را فراموش کرده‌اید؟</a>
                                        </div>
                                        <label class="form-label" for="password-input">رمز عبور <span class="text-danger">*</span></label>
                                        <div class="position-relative auth-pass-inputgroup mb-3">
                                            <input type="password" class="form-control pe-5 password-input " placeholder="رمز عبور را وارد کنید" id="password-input" required="">
                                            <button class="btn btn-link position-absolute end-0 top-0 text-decoration-none text-muted password-addon" type="button" id="password-addon"><i class="ri-eye-fill align-middle"></i></button>
                                        </div>
                                    </div>
        
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="auth-remember-check">
                                        <label class="form-check-label" for="auth-remember-check">مرا به خاطر بسپار</label>
                                    </div>
        
                                    <div class="mt-4">
                                        <button class="btn btn-primary w-100" type="submit">ورود</button>
                                    </div>
        
                                    <div class="mt-4 pt-2 text-center">
                                        <div class="signin-other-title position-relative">
                                            <h5 class="fs-md mb-4 title">ورود با</h5>
                                        </div>
                                        <div class="pt-2 hstack gap-2 justify-content-center">
                                            <button type="button" class="btn btn-subtle-primary btn-icon"><i class="ri-facebook-fill fs-lg"></i></button>
                                            <button type="button" class="btn btn-subtle-danger btn-icon"><i class="ri-google-fill fs-lg"></i></button>
                                            <button type="button" class="btn btn-subtle-dark btn-icon"><i class="ri-github-fill fs-lg"></i></button>
                                            <button type="button" class="btn btn-subtle-info btn-icon"><i class="ri-twitter-fill fs-lg"></i></button>
                                        </div>
                                    </div>
                                </form>
        
                                <div class="text-center mt-5">
                                    <p class="mb-0">حساب کاربری ندارید؟ <a href="auth-signup.html" class="fw-semibold text-secondary text-decoration-underline"> ثبت‌نام</a> </p>
                                </div>
                            </div>
                        </div><!-- end card body -->
                    </div><!-- end card -->
                </div>
                <!--end col-->
            </div>
            <!--end row-->
        </div>
    </section>

    <!-- JAVASCRIPT -->
    <script src="assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/libs/simplebar/dist/simplebar.min.js"></script>
    <script src="assets/js/plugins.js"></script>    <script src="assets/js/pages/password-addon.init.js"></script>

</body>

</html>
