<head>

    <meta charset="utf-8">
    <title>عنوان | داسیکس - قالب مدیریت و داشبورد</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="قالب مینیمال مدیریت و داشبورد" name="description">
    <meta content="Themesbrand" name="author">
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">
    
    <!-- Fonts css load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    
    <!-- Layout config Js -->
    <script src="assets/js/layout.js"></script>
    <!-- Bootstrap Css -->
    <link href="assets/css/bootstrap-rtl.min.css" rel="stylesheet" type="text/css">
    <!-- Icons Css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css">
    <!-- App Css-->
    <link href="assets/css/app-rtl.min.css" rel="stylesheet" type="text/css">
    <!-- custom Css-->
    <link href="assets/css/custom-rtl.min.css" rel="stylesheet" type="text/css">

<body>


    <section class="auth-page-wrapper p-2 p-lg-4 position-relative d-flex align-items-center justify-content-center min-vh-100">
        <div class="card mb-0 w-100 p-3 p-lg-2" style="background-image: url('assets/images/auth/auth.jpg');background-size: cover;background-position: center;">
            <div class="effect-one"></div>
            <div class="row g-0 align-items-center">
                <div class="col-xxl-8 order-last order-xl-first">
                    <div class="card auth-card border-0 shadow-none mb-0 bg-transparent">
                        <div class="card-body p-4 p-xl-5 d-flex justify-content-between flex-column h-100">
    
                            <div class="text-center mt-auto">
                                <p class="mb-0 mt-3 text-white">
                                    &copy;
                                    <script>document.write(new Date().getFullYear())</script> داسیکس. با عشق طراحی شده <i class="mdi mdi-heart text-danger"></i> توسط تیم Themesbrand
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <!--end col-->
                <div class="col-xxl-4 mx-auto">
                    <div class="card shadow-lg border-none m-lg-5">
                        <div class="card-body">
                            <div class="text-center mt-4">
                                <div class="mb-4 pb-4">
                                    <a href="index.html" class="auth-logo">
                                        <img src="assets/images/logo-dark.png" alt="" height="30" class="auth-logo-dark mx-auto">
                                        <img src="assets/images/logo-light.png" alt="" height="30" class="auth-logo-light mx-auto">
                                    </a>
                                </div>
                            </div>
                            <div class="text-muted text-center mb-4 mx-lg-3">
                                <div class="mb-4">
                                    <img src="assets/images/auth/permission.png" alt="" class="avatar-md">
                                </div>
                                <h4>ایمیل خود را تأیید کنید</h4>
                                <p>لطفاً کد ۴ رقمی ارسال شده به <span class="fw-semibold">example@abc.com</span> را وارد کنید</p>
                            </div>
                            <div class="p-2">
                                <form autocomplete="off">
                                    <div class="row">
                                        <div class="col-3">
                                            <div class="mb-3">
                                                <label for="digit1-input" class="visually-hidden">رقم ۱</label>
                                                <input type="text" class="form-control form-control-lg text-center" placeholder="0" onkeyup="moveToNext(1, event)" maxlength="1" id="digit1-input">
                                            </div>
                                        </div><!-- end col -->
                                
                                        <div class="col-3">
                                            <div class="mb-3">
                                                <label for="digit2-input" class="visually-hidden">رقم ۲</label>
                                                <input type="text" class="form-control form-control-lg text-center" placeholder="0" onkeyup="moveToNext(2, event)" maxlength="1" id="digit2-input">
                                            </div>
                                        </div><!-- end col -->
                                
                                        <div class="col-3">
                                            <div class="mb-3">
                                                <label for="digit3-input" class="visually-hidden">رقم ۳</label>
                                                <input type="text" class="form-control form-control-lg text-center" placeholder="0" onkeyup="moveToNext(3, event)" maxlength="1" id="digit3-input">
                                            </div>
                                        </div><!-- end col -->
                                
                                        <div class="col-3">
                                            <div class="mb-3">
                                                <label for="digit4-input" class="visually-hidden">رقم ۴</label>
                                                <input type="text" class="form-control form-control-lg text-center" placeholder="0" onkeyup="moveToNext(4, event)" maxlength="1" id="digit4-input">
                                            </div>
                                        </div><!-- end col -->
                                    </div>
                                </form><!-- end form -->
                                
                                <div class="mt-3">
                                    <button type="button" class="btn btn-primary w-100">تأیید</button>
                                </div>
        
                                <div class="mt-5 text-center">
                                    <p class="mb-0">کدی دریافت نکردید؟ <a href="auth-pass-reset.html" class="fw-semibold text-primary text-decoration-underline">دوباره ارسال کنید</a> </p>
                                </div>
                            </div>
                        </div><!-- end card body -->
                    </div><!-- end card -->
                </div>
                <!--end col-->
            </div>
            <!--end row-->
        </div>
    </section>

    <!-- JAVASCRIPT -->
    <script src="assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/libs/simplebar/dist/simplebar.min.js"></script>
    <script src="assets/js/plugins.js"></script>    <script src="assets/js/pages/two-step-verification.init.js"></script>
